[package]
name = "rn-gpui-updater"
version = "0.1.0"
edition = "2021"

[dependencies]
rn-gpui-module = { version = "0.1" }
futures = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
semver = "1"
sha2 = "0.10"
base64 = "0.22"
dirs = "5"
libc = "0.2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[build-dependencies]
rn-gpui-module-build = { version = "0.1" }
