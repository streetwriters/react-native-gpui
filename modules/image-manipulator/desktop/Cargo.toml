[package]
name = "rn-gpui-image-manipulator"
version = "0.1.0"
edition = "2021"

[dependencies]
rn-gpui-module = { version = "0.1" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
dirs = "5"

[build-dependencies]
rn-gpui-module-build = { version = "0.1" }
