[package]
name = "rn-gpui-webauthn"
version = "0.1.0"
edition = "2021"

[features]
# The in-process software authenticator and the call that installs it are in
# every build with debug assertions, which a release build has not. This turns
# them on in a release-profile build made for tests.
soft-authenticator = []

[dependencies]
rn-gpui-module = { version = "0.1" }
futures = "0.3"
ciborium = "0.2"
hidapi = "2"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"

[build-dependencies]
rn-gpui-module-build = { version = "0.1" }
