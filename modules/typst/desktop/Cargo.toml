[package]
name = "rn-gpui-typst"
version = "0.1.0"
edition = "2021"

[build-dependencies]
rn-gpui-module-build = "0.1"

[dependencies]
rn-gpui-module = "0.1"
react-native-gpui = "0.1"
futures = "0.3"
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
fontdb = { version = "0.23", default-features = false, features = ["memmap", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"


[workspace]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.dev.package.rn-gpui-sys]
opt-level = 0

[patch.crates-io]
# Managed by @react-native-gpui/cli autolink; do not edit between these markers.
rn-gpui-module = { path = "../../../packages/core/ReactGpui/rn-gpui-module" }
rn-gpui-module-build = { path = "../../../packages/core/ReactGpui/rn-gpui-module-build" }
rn-gpui-sys = { path = "../../../packages/core/ReactGpui/rn-gpui-sys" }
react-native-gpui = { path = "../../../packages/core/ReactGpui/rn-gpui" }
gpui = { git = "https://github.com/streetwriters/gpui-fast", rev = "5392403" }
gpui_platform = { git = "https://github.com/streetwriters/gpui-fast", rev = "5392403" }
# End managed by autolink.
