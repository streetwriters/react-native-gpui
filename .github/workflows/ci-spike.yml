name: ci-spike

# Temporary: answers one question per OS before ci.yml depends on it — can the
# runner open a window and render a frame, and how long does each step take?
# Deleted again in B6.
#
# `workflow_dispatch` only works for a workflow that exists on the default
# branch, so while this spike lives on `alpha/b-ci` it is also triggered by a
# push that touches this file. That keeps the run to one, which is the point.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ci-spike.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  window:
    name: window on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: win32-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # The -dev packages are what the CLI's preflight checks for through
          # pkg-config (xkbcommon, xkbcommon-x11, xcb); the runtime libraries
          # alone are not enough.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache nasm pkg-config \
            xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libxkbcommon-x11-0 libwayland-dev

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja ccache nasm

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y ninja ccache nasm strawberryperl
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Strawberry\perl\bin'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'

      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $instance = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $instance) { throw "no Visual Studio with the x64 C++ tools" }
          $vcvars = Join-Path $instance 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" x64 >nul 2>&1 && set" | ForEach-Object {
            $split = $_.IndexOf('=')
            if ($split -gt 0) {
              $name = $_.Substring(0, $split)
              $value = $_.Substring($split + 1)
              Set-Item -Path "env:$name" -Value $value
              Add-Content -Path $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
            }
          }
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $cl) { throw "cl.exe is not on PATH after vcvarsall x64" }
          $link = (Get-Command link.exe -ErrorAction Stop).Source
          if ($link -notmatch 'MSVC') { throw "link.exe resolves to $link, not MSVC" }
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" -Encoding utf8

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Hermes binaries are gitignored. The default mode downloads this host's
      # zip from the pinned release, and the link needs the shared library.
      - name: Fetch Hermes binaries
        run: node packages/hermes/scripts/fetch-binaries.mjs --platform ${{ matrix.platform }}

      - name: Cache the prebuilt runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rn-gpui-prebuilt
          key: spike-prebuilt-${{ matrix.platform }}-${{ hashFiles('packages/core/prebuilt-binaries.json') }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rn-gpui-tester/desktop

      # The CMake tree is deliberately not cached: it holds native-deps and a
      # CMakeCache of absolute paths, and a stale restore would confuse the
      # answer this spike exists to give. A cold build is the honest number.
      - name: Build the tester
        id: build
        env:
          RN_GPUI_PREBUILT_CACHE: ${{ runner.temp }}/rn-gpui-prebuilt
        run: |
          set -o pipefail
          start=$(date +%s)
          npm run desktop -- --no-launch 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Which C++ runtime was linked
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            grep -E "using prebuilt runtime|no prebuilt runtime" "$RUNNER_TEMP/build.log" || echo "(no runtime line)"
            echo '```'
            echo "build: ${{ steps.build.outputs.seconds }}s"
          } >> "$GITHUB_STEP_SUMMARY"

      # One run of the built binary. RN_GPUI_SMOKE=1 exits 0 on the first frame,
      # 1 on timeout and 2 on a JS error, so the exit code is the answer.
      - name: Smoke run
        id: smoke
        continue-on-error: true
        env:
          RN_GPUI_SMOKE: '1'
          RN_GPUI_SMOKE_TIMEOUT_MS: '120000'
          RN_GPUI_PREBUILT_CACHE: ${{ runner.temp }}/rn-gpui-prebuilt
        run: |
          set -o pipefail
          start=$(date +%s)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x900x24" \
              npm run desktop 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          else
            npm run desktop 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          fi
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Record the result
        if: always()
        run: |
          status='${{ steps.smoke.outputs.status }}'
          if [ "$status" = "0" ]; then
            verdict="renders (first frame)"
          elif [ -z "$status" ]; then
            verdict="not run"
          else
            verdict="no frame (smoke exit $status)"
          fi
          {
            echo "smoke: $verdict in ${{ steps.smoke.outputs.seconds }}s"
            echo '```'
            grep -E "RN_GPUI_SMOKE|Devserver is not provided|Loading JS bundle" "$RUNNER_TEMP/smoke.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/smoke.log
            packages/rn-gpui-tester/desktop/build/metro.log
          retention-days: 7
          if-no-files-found: ignore
