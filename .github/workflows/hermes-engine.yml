name: hermes-engine

# Builds the pinned Hermes VM and compiler for every platform we ship and
# uploads one artifact per platform. Each artifact carries its files under
# `bin/<platform>-<arch>/`, so it can be dropped straight into
# `packages/@react-native-gpui/hermes/bin` with:
#
#   node packages/@react-native-gpui/hermes/scripts/fetch-binaries.mjs --from <artifact.zip>
#
# or, with an authenticated `gh` and a successful run:
#
#   node packages/@react-native-gpui/hermes/scripts/fetch-binaries.mjs
#
# The `headers` job also verifies that the headers committed in
# packages/@react-native-gpui/hermes match the pinned commit exactly.

on:
  workflow_dispatch:
    inputs:
      hermes_commit:
        description: Hermes commit to build (defaults to the pin below)
        type: string
        required: false
      release_tag:
        description: Optional release tag to attach the built binaries to
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/hermes-engine.yml'
      - 'packages/@react-native-gpui/hermes/**'

permissions:
  contents: read

env:
  HERMES_REPOSITORY: facebook/hermes
  HERMES_COMMIT: 10a40b5f1de81d007cba6afe567c4ba7a0b45f5d

jobs:
  headers:
    name: verify vendored headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned Hermes headers
        run: |
          set -euo pipefail
          commit='${{ inputs.hermes_commit || env.HERMES_COMMIT }}'
          git clone --filter=blob:none --no-checkout --depth 1 \
            "https://github.com/${HERMES_REPOSITORY}.git" "$RUNNER_TEMP/hermes"
          git -C "$RUNNER_TEMP/hermes" fetch --depth 1 origin "$commit"
          git -C "$RUNNER_TEMP/hermes" checkout FETCH_HEAD -- \
            include public API/CMakeLists.txt API/hermes API/jsi API/napi API/hermes_abi
      - name: Compare against the committed headers
        run: |
          set -euo pipefail
          for dir in include public API; do
            diff -r "$RUNNER_TEMP/hermes/$dir" "packages/@react-native-gpui/hermes/$dir"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-headers
          path: |
            packages/@react-native-gpui/hermes/include
            packages/@react-native-gpui/hermes/public
            packages/@react-native-gpui/hermes/API
          if-no-files-found: error

  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64
          - platform: darwin-x64
            os: macos-14
            configure: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - platform: linux-x64
            os: ubuntu-24.04
            configure: ''
          # `ubuntu-24.04-arm` needs arm64 runners (free on public repos). To
          # cross-compile instead, use ubuntu-24.04 with:
          #   -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64
          #   -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
          #   -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            configure: ''
          - platform: win32-x64
            os: windows-2022
            configure: -A x64
          - platform: win32-arm64
            os: windows-11-arm
            configure: -A arm64
    steps:
      - name: Check out Hermes at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HERMES_REPOSITORY }}
          ref: ${{ inputs.hermes_commit || env.HERMES_COMMIT }}
          path: hermes
          fetch-depth: 1

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Configure
        if: runner.os != 'Windows'
        run: |
          cmake -S hermes -B hermes-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHERMES_ENABLE_NAPI=ON \
            -DHERMES_ENABLE_DEBUGGER=ON \
            -DHERMES_ENABLE_TEST_SUITE=OFF \
            -DHERMES_BUILD_APPLE_FRAMEWORK=OFF \
            ${{ matrix.configure }}

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build hermes-build --target hermesvm hermesc --parallel

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S hermes -B hermes-build -G 'Visual Studio 17 2022' ${{ matrix.configure }} `
            -DHERMES_ENABLE_NAPI=ON -DHERMES_ENABLE_DEBUGGER=ON `
            -DHERMES_ENABLE_TEST_SUITE=OFF -DHERMES_BUILD_APPLE_FRAMEWORK=OFF

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build hermes-build --config Release --target hermesvm hermesc --parallel

      - name: Stage binaries
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          platform='${{ matrix.platform }}'
          case "$platform" in
            darwin-*) library='libhermesvm.dylib' ;;
            linux-*)  library='libhermesvm.so' ;;
            *) echo "Unsupported platform: $platform" >&2; exit 1 ;;
          esac
          mkdir -p "bin/$platform"
          cp "$(find hermes-build -name "$library" -type f -print -quit)" "bin/$platform/$library"
          cp "$(find hermes-build -name hermesc -type f -print -quit)" "bin/$platform/hermesc"
          chmod +x "bin/$platform/hermesc"
          "bin/$platform/hermesc" -version

      - name: Stage binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          $target = "bin/$platform"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $vm = Get-ChildItem -Path hermes-build -Filter hermesvm.dll -Recurse -File | Select-Object -First 1
          $importLibrary = Get-ChildItem -Path hermes-build -Filter hermesvm.lib -Recurse -File | Select-Object -First 1
          $compiler = Get-ChildItem -Path hermes-build -Filter hermesc.exe -Recurse -File | Select-Object -First 1
          if (-not $vm -or -not $importLibrary -or -not $compiler) {
            throw 'Could not find hermesvm.dll, hermesvm.lib and hermesc.exe under hermes-build.'
          }
          Copy-Item $vm.FullName "$target/hermesvm.dll"
          Copy-Item $importLibrary.FullName "$target/hermesvm.lib"
          Copy-Item $compiler.FullName "$target/hermesc.exe"
          Get-ChildItem -Path (Split-Path $compiler.FullName) -Filter *.dll |
            Copy-Item -Destination $target -Force
          & "$target/hermesc.exe" -version

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.platform }}
          path: bin/
          if-no-files-found: error

  release:
    name: attach binaries to a release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: hermes-{darwin,linux,win32}-*
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          commit='${{ inputs.hermes_commit || env.HERMES_COMMIT }}'
          cd artifacts
          for dir in hermes-*; do zip -qr "$dir.zip" "$dir"; done
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "Hermes $commit" \
              --notes "Prebuilt Hermes VM and compiler binaries for react-native-gpui (facebook/hermes@$commit)."
          gh release upload "$tag" hermes-*.zip --repo "${{ github.repository }}" --clobber
