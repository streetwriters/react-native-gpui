name: hermes-engine

# Builds the pinned Hermes VM and compiler for every platform we ship and
# uploads one artifact per platform. Each artifact carries its files under
# `bin/<platform>-<arch>/`, so it can be dropped straight into
# `packages/@react-native-gpui/hermes/bin` with:
#
#   node packages/@react-native-gpui/hermes/scripts/fetch-binaries.mjs --from <artifact.zip>
#
# or, with an authenticated `gh` and a successful run:
#
#   node packages/@react-native-gpui/hermes/scripts/fetch-binaries.mjs
#
# The `headers` job also verifies that the headers committed in
# packages/@react-native-gpui/hermes match the pinned commit exactly.
#
# The per-OS toolchains follow facebook/hermes' own workflows:
#   * build-hermesc-linux.yml — apt dependency list
#   * build-hermesc-windows.yml — MSVC on `windows-2022`
#   * build-hermes-macos.yml — Apple builds on `macos-15`
#   * build.yml (test-windows-test262) — the Windows arm64 combination:
#     `windows-11-arm` with -DBOOST_CONTEXT_IMPLEMENTATION=winfib, because
#     Boost.Context's default fcontext backend has no MSVC ARM64 path.
#
# Intl is enabled on Apple only (-DHERMES_ENABLE_INTL=ON), where Hermes backs it
# with Foundation and nothing extra ships. Elsewhere Hermes's Intl backend
# (lib/Platform/Intl/PlatformIntlICU.cpp) needs ICU's C++ API, which the ICU
# built into Windows does not expose, and its NumberFormat is a stub; bundling
# ICU would add ~30 MB. Windows and Linux build with Intl off until Hermes gets
# a backend that loads the OS's ICU at runtime. The Unicode layer still uses
# ICU on those platforms (libicu-dev on Linux, Windows 10 1703+ ICU on Windows).
# The Apple legs also build the `hermes` CLI and run an Intl smoke test against
# the freshly built VM, so a linking-only success cannot pass for working Intl.

on:
  workflow_dispatch:
    inputs:
      hermes_commit:
        description: Hermes commit to build (defaults to the pin below)
        type: string
        required: false
      release_tag:
        description: Optional release tag to attach the built binaries to
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/hermes-engine.yml'
      - 'packages/@react-native-gpui/hermes/**'

permissions:
  contents: read

env:
  HERMES_REPOSITORY: facebook/hermes
  HERMES_COMMIT: 10a40b5f1de81d007cba6afe567c4ba7a0b45f5d

jobs:
  headers:
    name: verify vendored headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # One codeload tarball rather than a partial clone: `git clone
      # --filter=blob:none` plus `checkout FETCH_HEAD -- <paths>` fetches blobs
      # one at a time and takes tens of minutes on this tree.
      - name: Fetch the pinned Hermes headers
        run: |
          set -euo pipefail
          commit='${{ inputs.hermes_commit || env.HERMES_COMMIT }}'
          curl -fsSL "https://codeload.github.com/${HERMES_REPOSITORY}/tar.gz/${commit}" \
            -o "$RUNNER_TEMP/hermes.tar.gz"
          mkdir -p "$RUNNER_TEMP/hermes"
          tar -xzf "$RUNNER_TEMP/hermes.tar.gz" -C "$RUNNER_TEMP/hermes" \
            --strip-components=1 \
            --wildcards '*/API/hermes' '*/API/jsi' '*/API/napi' '*/API/hermes_abi' \
            '*/public/hermes/Public' '*/include/hermes/napi' '*/LICENSE'
      # The package ships only the headers needed to compile against the VM:
      # every header under API/{hermes,jsi,napi,hermes_abi} (API/hermes_sandbox is
      # not used), plus what those include from public/hermes/Public and
      # include/hermes/napi.
      # Select the same set from upstream and require an exact match, so a
      # missing, extra or edited file fails the job.
      - name: Compare against the committed headers
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hermes"
          expected="$RUNNER_TEMP/expected"
          mkdir -p "$expected"
          (
            cd "$src"
            find API -name '*.h'
            find public/hermes/Public -maxdepth 1 -name '*.h'
            find include/hermes/napi -maxdepth 1 \( -name '*.h' -o -name '*.md' \)
          ) | while read -r file; do
            mkdir -p "$expected/$(dirname "$file")"
            cp "$src/$file" "$expected/$file"
          done
          for dir in API public include; do
            diff -r "$expected/$dir" "packages/@react-native-gpui/hermes/$dir"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-headers
          path: |
            packages/@react-native-gpui/hermes/include
            packages/@react-native-gpui/hermes/public
            packages/@react-native-gpui/hermes/API
          if-no-files-found: error

  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64
          - platform: darwin-x64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - platform: linux-x64
            os: ubuntu-24.04
            configure: ''
          # `ubuntu-24.04-arm` needs arm64 runners (free on public repos). To
          # cross-compile instead, use ubuntu-24.04 with:
          #   -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64
          #   -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
          #   -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            configure: ''
          - platform: win32-x64
            os: windows-2022
            arch: x64
            configure: ''
          - platform: win32-arm64
            os: windows-11-arm
            arch: arm64
            configure: -DBOOST_CONTEXT_IMPLEMENTATION=winfib
    steps:
      - name: Check out Hermes at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HERMES_REPOSITORY }}
          ref: ${{ inputs.hermes_commit || env.HERMES_COMMIT }}
          path: hermes
          fetch-depth: 1

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libicu-dev libreadline-dev

      # Ninja rather than the Visual Studio generator: the generator name is
      # tied to the installed Visual Studio version while the MSVC environment
      # works the same on every image. Two things follow, both Windows-only: the
      # vcvars environment has to be exported through $GITHUB_ENV, because every
      # `run:` step is a fresh process, and the NAPI test addons need the CMake
      # fix applied by the "Prepare Hermes for Ninja" step below. Locally,
      # `scripts/build-hermes-windows.ps1` takes the same Ninja path.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $component = if ($arch -eq 'arm64') {
            'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          } else {
            'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          $instance = & $vswhere -latest -products * -requires $component -property installationPath
          if (-not $instance) { throw "No Visual Studio installation provides $component" }
          $version = & $vswhere -latest -products * -requires $component -property catalog_productDisplayVersion
          Write-Host "Using Visual Studio $version at $instance"
          $vcvars = Join-Path $instance 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }
          cmd /c "`"$vcvars`" $arch >nul 2>&1 && set" | ForEach-Object {
            $split = $_.IndexOf('=')
            if ($split -gt 0) {
              $name = $_.Substring(0, $split)
              $value = $_.Substring($split + 1)
              Set-Item -Path "env:$name" -Value $value
              Add-Content -Path $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
            }
          }
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $cl) { throw "cl.exe is not on PATH after vcvarsall $arch" }
          Write-Host "MSVC compiler: $($cl.Source)"

      # Hermes registers the same addon name in both NAPI test suites
      # (test_exception, test_finalizer, test_general). A Windows shared library
      # also emits an import library, and the addon helper only sets the
      # LIBRARY/RUNTIME output directories, so both copies would write
      # `<dir>/<addon>.lib`. The Visual Studio generator tolerates that; Ninja
      # rejects the whole graph with "multiple rules generate <path>". Giving
      # every addon its own archive directory keeps them buildable.
      - name: Prepare Hermes for Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = 'hermes/external/node-api-tests/hermes/CMakeLists.txt'
          $needle = '    RUNTIME_OUTPUT_DIRECTORY_RELEASE ${ADDON_OUTPUT_DIR}'
          if (-not (Test-Path $path)) { throw "Missing $path" }
          $text = Get-Content -Path $path -Raw
          if ($text -match 'ARCHIVE_OUTPUT_DIRECTORY') {
            Write-Host "$path already sets ARCHIVE_OUTPUT_DIRECTORY"
          } elseif ($text.Contains($needle)) {
            $addition = $needle + "`n    ARCHIVE_OUTPUT_DIRECTORY " + '${ADDON_OUTPUT_DIR}'
            Set-Content -Path $path -Value $text.Replace($needle, $addition) -NoNewline
            Write-Host "Patched $path so every addon archives into its own directory"
          } else {
            throw "Hermes changed $path; update the Ninja duplicate-output workaround"
          }

      - name: Configure
        if: runner.os != 'Windows'
        run: |
          cmake -S hermes -B hermes-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHERMES_ENABLE_NAPI=ON \
            -DHERMES_ENABLE_DEBUGGER=ON \
            -DHERMES_ENABLE_TEST_SUITE=OFF \
            -DHERMES_ENABLE_INTL=${{ runner.os == 'macOS' && 'ON' || 'OFF' }} \
            -DHERMES_BUILD_APPLE_FRAMEWORK=OFF \
            ${{ matrix.configure }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S hermes -B hermes-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DHERMES_ENABLE_NAPI=ON `
            -DHERMES_ENABLE_DEBUGGER=ON `
            -DHERMES_ENABLE_TEST_SUITE=OFF `
            -DHERMES_ENABLE_INTL=OFF `
            ${{ matrix.configure }}
          if ($LASTEXITCODE -ne 0) { throw "Hermes configure failed ($LASTEXITCODE)" }
          $cache = Get-Content hermes-build/CMakeCache.txt -Raw
          if ($cache -notmatch 'cl\.exe') {
            throw 'CMake did not configure an MSVC toolchain; the vcvars environment did not reach this step'
          }
          Select-String -Path hermes-build/CMakeCache.txt -Pattern '^CMAKE_(C|CXX)_COMPILER:' |
            ForEach-Object { Write-Host $_.Line }

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build hermes-build --target hermesvm hermesc hermes --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build hermes-build --target hermesvm hermesc hermes --parallel
          if ($LASTEXITCODE -ne 0) { throw "Hermes build failed ($LASTEXITCODE)" }

      - name: Stage binaries
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          platform='${{ matrix.platform }}'
          case "$platform" in
            darwin-*) library='libhermesvm.dylib' ;;
            linux-*)  library='libhermesvm.so' ;;
            *) echo "Unsupported platform: $platform" >&2; exit 1 ;;
          esac
          mkdir -p "bin/$platform"
          cp "$(find hermes-build -name "$library" -type f -print -quit)" "bin/$platform/$library"
          cp "$(find hermes-build -name hermesc -type f -print -quit)" "bin/$platform/hermesc"
          chmod +x "bin/$platform/hermesc"
          "bin/$platform/hermesc" -version

      - name: Stage binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          $target = "bin/$platform"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $vm = Get-ChildItem -Path hermes-build -Filter hermesvm.dll -Recurse -File | Select-Object -First 1
          $importLibrary = Get-ChildItem -Path hermes-build -Filter hermesvm.lib -Recurse -File | Select-Object -First 1
          $compiler = Get-ChildItem -Path hermes-build -Filter hermesc.exe -Recurse -File | Select-Object -First 1
          if (-not $vm -or -not $importLibrary -or -not $compiler) {
            throw 'Could not find hermesvm.dll, hermesvm.lib and hermesc.exe under hermes-build.'
          }
          Copy-Item $vm.FullName "$target/hermesvm.dll"
          Copy-Item $importLibrary.FullName "$target/hermesvm.lib"
          Copy-Item $compiler.FullName "$target/hermesc.exe"
          Get-ChildItem -Path (Split-Path $compiler.FullName) -Filter *.dll |
            Copy-Item -Destination $target -Force
          & "$target/hermesc.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "The staged hermesc failed its version check ($LASTEXITCODE)" }

      - name: Verify Intl
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/intl-smoke.js" <<'JS'
          const number = new Intl.NumberFormat('en-US').format(1234.5);
          const date = new Intl.DateTimeFormat('en-US', {
            timeZone: 'UTC',
            year: 'numeric',
            month: 'long',
            day: 'numeric',
          }).format(0);
          const order = new Intl.Collator('en-US').compare('a', 'b');
          print('Intl.NumberFormat en-US 1234.5 -> ' + number);
          print('Intl.DateTimeFormat en-US 0 -> ' + date);
          print('Intl.Collator compare(a, b) -> ' + order);
          if (number !== '1,234.5') throw new Error('unexpected number format: ' + number);
          if (date.indexOf('January') !== 0 || date.indexOf('1970') < 0) {
            throw new Error('unexpected date format: ' + date);
          }
          if (order >= 0) throw new Error('unexpected collation order: ' + order);
          print('Intl OK');
          JS
          ./hermes-build/bin/hermes "$RUNNER_TEMP/intl-smoke.js"

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.platform }}
          path: bin/
          if-no-files-found: error

  release:
    name: attach binaries to a release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: hermes-{darwin,linux,win32}-*
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          commit='${{ inputs.hermes_commit || env.HERMES_COMMIT }}'
          cd artifacts
          for dir in hermes-*; do zip -qr "$dir.zip" "$dir"; done
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "Hermes $commit" \
              --notes "Prebuilt Hermes VM and compiler binaries for react-native-gpui (facebook/hermes@$commit)."
          gh release upload "$tag" hermes-*.zip --repo "${{ github.repository }}" --clobber
