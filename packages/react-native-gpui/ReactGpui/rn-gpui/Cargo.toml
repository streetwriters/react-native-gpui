[package]
name = "react-native-gpui"
version = "0.1.0"
edition = "2021"
links = "rn_gpui_runtime"

[features]
# Test/probe controls: synthetic input, resize/scale/headless overrides, custom
# window-state paths, startup tracing, native-view probes, and frame capture.
# `RN_GPUI_SCREENSHOT` renders the window's own scene to a PNG off-screen.
# gpui's `Window::render_to_image` is gated on `test-support` in gpui, gpui_macos
# and gpui_apple, so the feature has to be enabled at the platform crate too.
visual-capture = ["gpui_platform/test-support"]
# Enables Window's draw/present histograms for the 10k-node benchmark.
perf-timing = ["gpui/profiler"]

[dependencies]
rn-gpui-sys = { path = "../rn-gpui-sys" }
gpui = { workspace = true }
# `font-kit` is what makes gpui_macos build a real (CoreText) text system;
# without it every glyph paints as nothing (TODO 1.11).
gpui_platform = { workspace = true, features = ["font-kit"] }
cxx = { workspace = true }
async-channel = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
reqwest_client = { workspace = true }
http_client = { workspace = true }
fontdue = { workspace = true }
image = { version = "0.25.1" }
base64 = "0.22"
rn-gpui-macros = { path = "../rn-gpui-macros" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
raw-window-handle = "0.6"
