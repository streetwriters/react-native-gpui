[workspace]
resolver = "2"
members = [
  "rn-gpui-sys", "rn-gpui", "rn-gpui-macros"
]

# Set CARGO_PROFILE_DEV_DEBUG=full to opt into full debug information.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"

[workspace.dependencies]
gpui = { git = "https://github.com/longbridge/gpui-fast", rev = "92a9b0f7041c8701d4aef4c05534a603caff75d3" }
gpui_platform = { git = "https://github.com/longbridge/gpui-fast", rev = "92a9b0f7041c8701d4aef4c05534a603caff75d3" }
cxx = "=1.0.202"
cxx-build = "=1.0.202"
cmake = "0.1"
async-channel = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde_json = "1"
futures = "0.3"
reqwest_client = { git = "https://github.com/longbridge/gpui-fast", rev = "92a9b0f7041c8701d4aef4c05534a603caff75d3" }
http_client = { git = "https://github.com/longbridge/gpui-fast", rev = "92a9b0f7041c8701d4aef4c05534a603caff75d3" }
fontdue = "0.9"
