[package]
name = "rn-gpui-host-components-fixture"
version = "0.1.0"
edition = "2021"

[build-dependencies]
rn-gpui-module-build = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
anyhow = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
] }

[dependencies]
react-native-gpui = "0.1"
rn-gpui-module = "0.1"
gpui = "0.2"
serde_json = "1"
log = "0.4"

# Its own workspace root, like every module crate: a module resolves core by
# version and must not be a member of the checkout's workspace, but Cargo only
# applies `[patch.crates-io]` at a workspace root, so it has to be one. That also
# lets `cargo test` run the fixture's own unit tests here.
[workspace]

# The checkout's shared dev profile (see core's `ReactGpui/Cargo.toml`): line tables
# only, no debug info for dependencies, which are optimized. Every workspace root
# builds into the one root `target/`, so a matching profile is also what lets them
# reuse each other's dependency builds instead of storing one copy each.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.dev.package.rn-gpui-sys]
opt-level = 0

[patch.crates-io]
# Managed by @react-native-gpui/cli autolink; do not edit between these markers.
react-native-gpui = { path = "../../../core/ReactGpui/rn-gpui" }
rn-gpui-sys = { path = "../../../core/ReactGpui/rn-gpui-sys" }
rn-gpui-module = { path = "../../../core/ReactGpui/rn-gpui-module" }
rn-gpui-module-build = { path = "../../../core/ReactGpui/rn-gpui-module-build" }
gpui = { git = "https://github.com/streetwriters/gpui-fast", rev = "a72b326" }
gpui_platform = { git = "https://github.com/streetwriters/gpui-fast", rev = "a72b326" }
# End managed by autolink.
