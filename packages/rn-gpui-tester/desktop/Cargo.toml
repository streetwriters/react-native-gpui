[package]
name = "rn-gpui-tester"
version = "0.1.0"
edition = "2021"

[features]
visual-capture = ["react-native-gpui/visual-capture"]
test-driver = ["react-native-gpui/test-driver"]

# Set CARGO_PROFILE_DEV_DEBUG=full to opt into full debug information.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

# Dependencies are optimized even in a dev build. GPUI rebuilds and paints the
# element tree on every frame, and unoptimized that alone takes about half of a
# 120 Hz frame; they are compiled once, so this costs nothing while iterating.
[profile.dev.package."*"]
debug = false
opt-level = 3

# The C++ bridge picks its CMake build type from this crate's opt-level, and a
# Release build of React Native has no dev server, inspector or Fast Refresh.
[profile.dev.package.rn-gpui-sys]
opt-level = 0

[profile.release]
# Line tables, not `false`: a release crash is worth symbolizing, and with
# `split-debuginfo` the debug info lives in a separate dSYM rather than the
# binary, so it costs the package nothing.
debug = "line-tables-only"
# Strip the symbol table: 10.2 MB of this binary, and nothing reads it at run
# time. The dSYM is kept beside the package for symbolizing crashes.
## Keep the symbols Cargo's link step produces: `strip = "symbols"` runs in the
## linker, so `dsymutil` runs afterwards on an already-stripped binary and writes
## an empty dSYM. The stripping happens in `package-desktop` instead, after the
## dSYM exists.
strip = "none"
split-debuginfo = "packed"

[build-dependencies]
serde_json = "1"
rn-gpui-module-build = { path = "../../core/ReactGpui/rn-gpui-module-build" }

[dependencies]


rn-gpui-module = { path = "../../core/ReactGpui/rn-gpui-module" }
rn-gpui-autolink = { path = "autolink" }
react-native-gpui = { path = "../../core/ReactGpui/rn-gpui" }
