[package]
name = "rn-gpui-tester"
version = "0.1.0"
edition = "2021"

[features]
visual-capture = ["react-native-gpui/visual-capture"]
test-driver = ["react-native-gpui/test-driver"]

# Set CARGO_PROFILE_DEV_DEBUG=full to opt into full debug information.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

# Dependencies are optimized even in a dev build. GPUI rebuilds and paints the
# element tree on every frame, and unoptimized that alone takes about half of a
# 120 Hz frame; they are compiled once, so this costs nothing while iterating.
[profile.dev.package."*"]
debug = false
opt-level = 3

# The C++ bridge picks its CMake build type from this crate's opt-level, and a
# Release build of React Native has no dev server, inspector or Fast Refresh.
[profile.dev.package.rn-gpui-sys]
opt-level = 0

[profile.release]
debug = false
strip = "debuginfo"

[build-dependencies]
serde_json = "1"
rn-gpui-module-build = { path = "../../react-native-gpui/ReactGpui/rn-gpui-module-build" }

[dependencies]


rn-gpui-module = { path = "../../react-native-gpui/ReactGpui/rn-gpui-module" }
rn-gpui-autolink = { path = "autolink" }
react-native-gpui = { path = "../../react-native-gpui/ReactGpui/rn-gpui" }

# TEMPORARY, never commit: build against the local gpui-fast clone while the
# Windows fixes are developed. Remove before committing the new pin.
[patch."https://github.com/streetwriters/gpui-fast"]
gpui = { path = "C:/Users/Hp/gpui-fast/crates/gpui" }
gpui_platform = { path = "C:/Users/Hp/gpui-fast/crates/gpui_platform" }
reqwest_client = { path = "C:/Users/Hp/gpui-fast/crates/reqwest_client" }
http_client = { path = "C:/Users/Hp/gpui-fast/crates/http_client" }
