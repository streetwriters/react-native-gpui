[package]
name = "rn-gpui-tester"
version = "0.1.0"
edition = "2021"

[features]
visual-capture = ["react-native-gpui/visual-capture"]
test-driver = ["react-native-gpui/test-driver"]

# Set CARGO_PROFILE_DEV_DEBUG=full to opt into full debug information.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

# Dependencies are optimized even in a dev build. GPUI rebuilds and paints the
# element tree on every frame, and unoptimized that alone takes about half of a
# 120 Hz frame; they are compiled once, so this costs nothing while iterating.
[profile.dev.package."*"]
debug = false
opt-level = 3

# The C++ bridge picks its CMake build type from this crate's opt-level, and a
# Release build of React Native has no dev server, inspector or Fast Refresh.
[profile.dev.package.rn-gpui-sys]
opt-level = 0

[profile.release]
# Line tables, not `false`: a release crash is worth symbolizing, and with
# `split-debuginfo` the debug info lives in a separate dSYM rather than the
# binary, so it costs the package nothing.
debug = "line-tables-only"
# The symbol table is not stripped here: Cargo strips inside the linker, before
# `dsymutil`, which would leave an empty dSYM. `package-desktop` writes the dSYM
# and then runs `strip -x`, which removes every unexported symbol.
strip = "none"
split-debuginfo = "packed"
# Thin LTO across crates: Rust's default is per-crate codegen only. `codegen-units
# = 1` lets the optimiser see the whole crate at once, which costs build time and
# buys size.
lto = "fat"
codegen-units = 1

[build-dependencies]
serde_json = "1"
rn-gpui-module-build = { path = "../../core/ReactGpui/rn-gpui-module-build" }

[dependencies]


rn-gpui-module = { path = "../../core/ReactGpui/rn-gpui-module" }
rn-gpui-autolink = { path = "autolink" }
react-native-gpui = { path = "../../core/ReactGpui/rn-gpui" }
# The GPUI-first example (`src/gpui_first.rs`) is a GPUI tree of its own.
gpui = "0.2"
serde_json = "1"

[patch.crates-io]
# Managed by @react-native-gpui/cli autolink; do not edit between these markers.
react-native-gpui = { path = "../../core/ReactGpui/rn-gpui" }
rn-gpui-sys = { path = "../../core/ReactGpui/rn-gpui-sys" }
rn-gpui-module = { path = "../../core/ReactGpui/rn-gpui-module" }
rn-gpui-module-build = { path = "../../core/ReactGpui/rn-gpui-module-build" }
gpui = { git = "https://github.com/streetwriters/gpui-fast", rev = "3a4e87e" }
gpui_platform = { git = "https://github.com/streetwriters/gpui-fast", rev = "3a4e87e" }
# End managed by autolink.
